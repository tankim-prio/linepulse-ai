[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linepulse-ai"
version = "0.1.0"
description = "CPU-friendly garment production risk, RAG, and agent platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas==2.2.3",
]

[project.scripts]
linepulse-validate = "linepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

