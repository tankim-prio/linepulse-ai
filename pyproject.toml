[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linepulse-ai"
version = "0.1.0"
description = "CPU-friendly garment production risk, RAG, and agent platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.8",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg2-binary==2.9.12",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx2==2.12.0",
]

[project.scripts]
linepulse-validate = "linepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
